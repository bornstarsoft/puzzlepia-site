<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" role="img" aria-labelledby="title desc">
  <title id="title">Memory pairs: eight-card example</title>
  <desc id="desc">Cards 1 to 8 show star, moon, sun, diamond, sun, diamond, star, moon.</desc>
  <rect width="560" height="300" rx="8" fill="#f5f3fa"/>
  <g stroke="#b8a5de" stroke-width="2">
    <rect x="20" y="20" width="115" height="120" rx="8" fill="#fff0d3"/>
    <rect x="155" y="20" width="115" height="120" rx="8" fill="#ffe9f1"/>
    <rect x="290" y="20" width="115" height="120" rx="8" fill="#d5f5e9"/>
    <rect x="425" y="20" width="115" height="120" rx="8" fill="#eae1fb"/>
    <rect x="20" y="160" width="115" height="120" rx="8" fill="#d5f5e9"/>
    <rect x="155" y="160" width="115" height="120" rx="8" fill="#eae1fb"/>
    <rect x="290" y="160" width="115" height="120" rx="8" fill="#fff0d3"/>
    <rect x="425" y="160" width="115" height="120" rx="8" fill="#ffe9f1"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#493276" text-anchor="middle">
    <g font-size="42"><text x="78" y="82">&#9733;</text><text x="213" y="82">&#9789;</text><text x="348" y="82">&#9728;</text><text x="483" y="82">&#9670;</text><text x="78" y="222">&#9728;</text><text x="213" y="222">&#9670;</text><text x="348" y="222">&#9733;</text><text x="483" y="222">&#9789;</text></g>
    <g font-size="16"><text x="78" y="118">1</text><text x="213" y="118">2</text><text x="348" y="118">3</text><text x="483" y="118">4</text><text x="78" y="258">5</text><text x="213" y="258">6</text><text x="348" y="258">7</text><text x="483" y="258">8</text></g>
  </g>
</svg>
