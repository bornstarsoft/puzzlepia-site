  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#241c35">
    <text x="116" y="40" font-size="24">A</text>
    <text x="204" y="40" font-size="24">B</text>
    <text x="292" y="40" font-size="24">C</text>
    <text x="380" y="40" font-size="24">D</text>
    <text x="40" y="118" font-size="24">1</text>
    <rect x="72" y="64" width="88" height="88" fill="#ffffff" stroke="#a79bb8" stroke-width="1.5"/>
    <rect x="160" y="64" width="88" height="88" fill="#6f45d8" stroke="#a79bb8" stroke-width="1.5"/>
    <rect x="248" y="64" width="88" height="88" fill="#6f45d8" stroke="#a79bb8" stroke-width="1.5"/>
