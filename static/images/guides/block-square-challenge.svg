<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480" role="img" aria-labelledby="title description">
  <title id="title">Find the only square space</title>
  <desc id="description">Occupied: B1 C1 D1 A2 D2 A3 B4 D4. Other cells are empty.</desc>
