    <rect x="160" y="152" width="88" height="88" fill="#ffffff" stroke="#a79bb8" stroke-width="1.5"/>
    <rect x="248" y="152" width="88" height="88" fill="#ffffff" stroke="#a79bb8" stroke-width="1.5"/>
    <rect x="336" y="152" width="88" height="88" fill="#6f45d8" stroke="#a79bb8" stroke-width="1.5"/>
    <text x="40" y="294" font-size="24">3</text>
    <rect x="72" y="240" width="88" height="88" fill="#6f45d8" stroke="#a79bb8" stroke-width="1.5"/>
    <rect x="160" y="240" width="88" height="88" fill="#ffffff" stroke="#a79bb8" stroke-width="1.5"/>
    <rect x="248" y="240" width="88" height="88" fill="#ffffff" stroke="#a79bb8" stroke-width="1.5"/>
    <rect x="336" y="240" width="88" height="88" fill="#ffffff" stroke="#a79bb8" stroke-width="1.5"/>
    <text x="40" y="382" font-size="24">4</text>
