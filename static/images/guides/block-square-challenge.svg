    <rect x="160" y="328" width="88" height="88" fill="#6f45d8" stroke="#a79bb8" stroke-width="1.5"/>
    <rect x="248" y="328" width="88" height="88" fill="#ffffff" stroke="#a79bb8" stroke-width="1.5"/>
    <rect x="336" y="328" width="88" height="88" fill="#6f45d8" stroke="#a79bb8" stroke-width="1.5"/>
