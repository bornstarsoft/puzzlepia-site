<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" role="img" aria-labelledby="title desc">
  <title id="title">Make 10: eight-tile example</title>
  <desc id="desc">Values at positions 1 to 8 are 2, 5, 9, 6, 4, 1, 5, 8.</desc>
  <rect width="560" height="300" rx="8" fill="#f5f3fa"/>
  <g fill="#ffffff" stroke="#b8a5de" stroke-width="2">
    <rect x="20" y="20" width="115" height="120" rx="8"/><rect x="155" y="20" width="115" height="120" rx="8"/><rect x="290" y="20" width="115" height="120" rx="8"/><rect x="425" y="20" width="115" height="120" rx="8"/>
    <rect x="20" y="160" width="115" height="120" rx="8"/><rect x="155" y="160" width="115" height="120" rx="8"/><rect x="290" y="160" width="115" height="120" rx="8"/><rect x="425" y="160" width="115" height="120" rx="8"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#493276" text-anchor="middle" font-size="42" font-weight="bold"><text x="78" y="92">2</text><text x="213" y="92">5</text><text x="348" y="92">9</text><text x="483" y="92">6</text><text x="78" y="232">4</text><text x="213" y="232">1</text><text x="348" y="232">5</text><text x="483" y="232">8</text></g>
  <g font-family="Arial, sans-serif" fill="#635874" font-size="16" text-anchor="end"><text x="124" y="128">1</text><text x="259" y="128">2</text><text x="394" y="128">3</text><text x="529" y="128">4</text><text x="124" y="268">5</text><text x="259" y="268">6</text><text x="394" y="268">7</text><text x="529" y="268">8</text></g>
</svg>
