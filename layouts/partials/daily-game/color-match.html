<section class="puzzle-card color-match-game" data-game="color-match" aria-labelledby="color-match-title">
  <div class="puzzle-card__header">
    <div>
      <p class="eyebrow">Playable starter</p>
      <h2 id="color-match-title">Find every pink tile</h2>
    </div>
    <p class="puzzle-status" data-status aria-live="polite">Pink tiles: 0 of 6 cleared.</p>
  </div>
  <p class="puzzle-instructions">Tap all six pink tiles. A wrong-color tap gives feedback and lets you keep playing.</p>
  <p class="puzzle-helper color-target">
    <span class="color-target__swatch" aria-hidden="true"></span>
    <span>Target: Pink (6 tiles)</span>
  </p>
  <div class="color-grid" data-grid aria-label="5 by 5 color matching grid"></div>
  <p class="puzzle-complete" data-complete hidden>Puzzle complete! Great job.</p>
  <div class="completion-actions" data-complete-actions hidden>
    <a class="button button--primary puzzle-cta" href="https://ringzzle.com/play/" rel="noopener" target="_blank">Play Ringzzle online</a>
    <a class="button button--secondary puzzle-cta" href="/games/ringzzle/">Explore Ringzzle</a>
  </div>
  <button class="button button--primary puzzle-reset" type="button" data-reset>Reset puzzle</button>
  <a class="button button--secondary puzzle-cta" href="/games/color-rings-mania/">Explore Color Rings Mania</a>
</section>
