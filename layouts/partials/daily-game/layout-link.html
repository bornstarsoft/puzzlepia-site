<details class="layout-share" data-layout-link-row hidden>
  <summary>Keep a link to this layout</summary>
  <p><a class="pair-layout-link" data-layout-link href="{{ .RelPermalink }}">Open this layout again</a></p>
  <div data-layout-share hidden>
    <label for="daily-layout-link">Layout link</label>
    <div class="layout-share__row">
      <input id="daily-layout-link" type="text" data-layout-link-value readonly spellcheck="false">
      <button class="button button--secondary" type="button" data-copy-layout>Copy link</button>
    </div>
    <p data-layout-share-status role="status"></p>
  </div>
  <p>This link opens the same board from the start, without your progress.</p>
</details>
